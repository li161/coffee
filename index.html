/* Cinematic product stage + explicit wine switching */
#app{background:radial-gradient(ellipse at 34% 43%,#6c342a 0,#321b19 34%,#180d12 67%,#08060b 100%)}

 .corkscrew{top:1%;transform:translateX(-50%) scale(.8) rotate(-18deg)}
}
@media(max-height:700px){
 .product{height:94vh}
 .stage .bottle-wrap{height:clamp(220px,39vh,300px)}
 .product-info h1{font-size:clamp(22px,2.5vw,32px)}
 .product-info p{margin-bottom:8px}
 .order{min-height:44px}
}
</style>
</head>
<body>
<main id="app">
 <div class="ambient" aria-hidden="true"></div>
 <section class="product" aria-label="葡萄酒样品">
  <div class="stage" id="stage">
   <div class="glow"></div><div class="reflection"></div>
   <button class="corkscrew" id="corkscrew" aria-label="点击使用开瓶器" aria-pressed="false" title="点击开瓶 / 再次点击复位"><span class="spiral"></span></button>
   <div class="bottle-wrap" id="bottleWrap" aria-label="可拖动查看的葡萄酒瓶">
    <div class="bottle">
     <div class="capsule"></div><div class="neck"></div><div class="shoulders"></div>
     <div class="body"><div class="label"><span class="seal">VINORA · EST. 1987</span><strong id="labelName">PINOT<br>NOIR</strong><span class="ornament"></span><span class="vintage">BOURGOGNE · 2022</span></div></div><div class="base"></div>
    </div>
   </div>
  </div>
  <div class="product-info">
   <div class="kicker" id="wineType">SINGLE VINEYARD · FRANCE</div>
   <h1 id="wineName">黑皮诺 · 勃艮第</h1>
   <p id="wineDesc">红樱桃 · 森林气息 · 细腻柔和</p>
   <button class="order" id="orderBtn">下单 · ¥ 268</button>
  </div>
 </section>
 <aside class="chat" aria-label="数字人品酒群聊">
  <header class="chat-head">
   <div class="group-avatar"><span class="face">🍷</span><span class="face">🍇</span><span class="face">🧑🏻‍🍳</span></div>
   <div><div class="chat-title">VINORA 品酒小组</div><div class="chat-sub">3 位数字顾问 · 正在一起讨论这瓶酒</div></div><div class="online">在线</div>
  </header>
  <div class="members" id="members">
   <button class="member active" data-role="sommelier">🍷 侍酒师</button>
   <button class="member" data-role="grower">🍇 产区顾问</button>
   <button class="member" data-role="chef">🍽️ 搭餐主厨</button>
  </div>
  <div class="log" id="log" aria-live="polite">
   <div class="msg"><div class="msg-face">🍷</div><div class="msg-content"><div class="msg-name">薇诺 · 侍酒师</div><div class="bubble">这瓶黑皮诺值得慢下来品。它的风格偏优雅，不靠厚重取胜。你更在意风味，还是想知道它配什么菜？</div></div></div>
   <div class="msg"><div class="msg-face">🍇</div><div class="msg-content"><div class="msg-name">路易 · 产区顾问</div><div class="bubble">勃艮第是黑皮诺的重要产区。具体酒庄和年份会带来差异，咱们先从杯中的红色水果香气开始认识它。</div></div></div>
  </div>
  <div class="prompts"><div class="prompt-label">和数字人聊聊</div><div class="prompt-row">
   <button class="prompt" data-question="这瓶酒有什么风味？">风味怎么样？</button>
   <button class="prompt" data-question="推荐一道适合搭配这瓶酒的菜。">怎么搭餐？</button>
   <button class="prompt" data-question="帮我比较一下赤霞珠和黑皮诺。">比较品种</button>
  </div></div>
  <form class="composer" id="chatForm"><input id="chatInput" autocomplete="off" placeholder="问问大家这瓶酒…" aria-label="输入消息"><button type="submit">发送 ↗</button></form>
 </aside>
 <div class="toast" id="toast" role="status"></div>
</main>
<script>
const wines=[
 {name:'黑皮诺 · 勃艮第',en:'PINOT<br>NOIR',type:'SINGLE VINEYARD · FRANCE',desc:'红樱桃 · 森林气息 · 细腻柔和',price:268,color:'#70243b',hi:'#ad5367',region:'勃艮第',profile:'优雅细腻，红樱桃、覆盆子与轻柔的森林气息。单宁通常较柔和，适合慢慢品味。'},
 {name:'赤霞珠 · 波尔多',en:'CABERNET<br>SAUVIGNON',type:'CLASSIC RED · FRANCE',desc:'黑醋栗 · 雪松 · 结构饱满',price:328,color:'#4c1728',hi:'#85364a',region:'波尔多',profile:'黑醋栗和深色水果风味更突出，结构感和单宁通常更明显，适合搭配牛排或硬质奶酪。'},
 {name:'长相思 · 卢瓦尔',en:'SAUVIGNON<br>BLANC',type:'CRISP WHITE · FRANCE',desc:'青柠 · 鲜草 · 清爽明亮',price:198,color:'#7f713c',hi:'#c2b36e',region:'卢瓦尔河谷',profile:'以清爽酸度、柑橘和草本气息见长，适合海鲜、山羊奶酪和清淡料理。'}
];
let current=0,role='sommelier',ordered=0,toastTimer;
const $=id=>document.getElementById(id),log=$('log');
const stage=$('stage');const mainBottle=$('bottleWrap');const bottleCards=[mainBottle];
for(let n=1;n<3;n++){const clone=mainBottle.cloneNode(true);clone.removeAttribute('id');clone.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));clone.dataset.carouselClone='true';clone.tabIndex=0;stage.appendChild(clone);bottleCards.push(clone)}
function paintBottle(card,w,idx){card.dataset.wineIndex=String(idx);card.querySelector('.body').style.background='linear-gradient(90deg,#160b08 0%,'+w.color+' 12%,'+w.hi+' 36%,'+w.color+' 59%,#35130e 84%,#100807 100%)';card.querySelector('.neck').style.background='linear-gradient(90deg,#210c16,'+w.color+' 19%,'+w.hi+' 34%,'+w.color+' 72%,#1b0b12)';card.querySelector('.shoulders').style.background='linear-gradient(90deg,#1c100c,'+w.color+' 20%,'+w.hi+' 38%,'+w.color+' 70%,#130a08)';card.querySelector('.base').style.background='linear-gradient(90deg,#1a0b08,'+w.color+' 28%,'+w.hi+' 48%,#32110c 80%,#100706)';card.querySelector('.label strong').innerHTML=w.en;card.querySelector('.label .vintage').textContent=w.region.toUpperCase()+' · 2022'}
function layoutCarousel(animate=true){const spread=Math.min(stage.clientWidth*(window.innerWidth<800?.3:.29),window.innerWidth<800?145:260);bottleCards.forEach(card=>{const previous=card.style.transform||getComputedStyle(card).transform;const delta=(Number(card.dataset.wineIndex)-current+wines.length)%wines.length;let target;if(delta===0){card.classList.remove('is-left','is-right');card.classList.add('is-center');target='translate(-50%,-50%) translateZ(125px) scale(1.12)';card.style.zIndex='8';card.style.opacity='1'}else if(delta===1){card.classList.remove('is-center','is-left');card.classList.add('is-right');target='translate(-50%,-47%) translateX('+spread+'px) translateZ(-100px) rotateY(-28deg) scale(.7)';card.style.zIndex='6';card.style.opacity='.94'}else{card.classList.remove('is-center','is-right');card.classList.add('is-left');target='translate(-50%,-47%) translateX(-'+spread+'px) translateZ(-100px) rotateY(28deg) scale(.7)';card.style.zIndex='6';card.style.opacity='.94'}card.style.transform=target;if(animate&&previous!==target){card.animate([{transform:previous,opacity:card.style.opacity},{transform:target,opacity:card.style.opacity}],{duration:780,easing:'cubic-bezier(.2,.78,.2,1)',fill:'none'})}})}
function renderWine(i,announce=true){const next=(i+wines.length)%wines.length;const changed=next!==current;current=next;bottleCards.forEach(card=>card.classList.remove('is-selected'));const w=wines[current];$('wineName').textContent=w.name;$('labelName').innerHTML=w.en;$('wineType').textContent=w.type;$('wineDesc').textContent=w.desc;$('orderBtn').textContent='下单 · ¥ '+w.price;document.documentElement.style.setProperty('--wine',w.color);document.documentElement.style.setProperty('--winehi',w.hi);bottleCards.forEach((card,n)=>paintBottle(card,wines[(current+n)%wines.length],(current+n)%wines.length));layoutCarousel();if(announce)addMessage('🍷','薇诺 · 侍酒师','我把当前酒款切换为「'+w.name+'」。'+w.profile)}
const roles={sommelier:{face:'🍷',name:'薇诺 · 侍酒师'},grower:{face:'🍇',name:'路易 · 产区顾问'},chef:{face:'🍽️',name:'米娅 · 搭餐主厨'}};
function addMessage(face,name,text,mine=false){const row=document.createElement('div');row.className='msg'+(mine?' mine':'');if(!mine){const icon=document.createElement('div');icon.className='msg-face';icon.textContent=face;row.append(icon)}const content=document.createElement('div');content.className='msg-content';if(!mine){const n=document.createElement('div');n.className='msg-name';n.textContent=name;content.append(n)}const bubble=document.createElement('div');bubble.className='bubble';bubble.textContent=text;content.append(bubble);row.append(content);log.append(row);log.scrollTop=log.scrollHeight}
function answer(q){const w=wines[current],s=q.toLowerCase();if(/搭配|搭餐|菜|吃|食物/.test(q)){return '米娅 · 搭餐主厨：'+(current===2?'试试柠檬烤鱼、鲜虾或山羊奶酪，别让厚重酱汁盖过清爽酸度。':current===1?'牛排、烤羊排或熟成硬质奶酪都很合适，蛋白质和脂肪能柔化单宁。':'烤鸡、菌菇意面或半熟金枪鱼都值得一试，避免太辣的调味。')+' 当然，最终还是以你的口味为准。'}if(/比较|区别|赤霞珠|黑皮诺|品种/.test(q)){return '路易 · 产区顾问：赤霞珠通常更有结构、黑色水果和单宁；黑皮诺通常更轻盈，红色水果与细腻香气更突出。产区、年份和酿造方式也会明显影响风格。'}if(/价格|贵|多少钱|下单|购买/.test(q)){return '薇诺 · 侍酒师：当前展示的是「'+w.name+'」，页面标价 ¥'+w.price+'。你可以点下方的下单按钮体验下单流程；真实支付尚未接入。'}if(/风味|香气|口感|味道/.test(q)){return '薇诺 · 侍酒师：'+w.profile+' 你可以先闻香，再小口品尝，留意入口酸度、单宁和咽下后的余味。'}if(/产区|哪里|法国|勃艮第|波尔多/.test(q)){return '路易 · 产区顾问：这款酒的展示产区是'+w.region+'。气候、土壤、地形和酿酒者选择都会影响风格；没有具体酒庄信息时，不宜把产区描述当成这瓶酒的完整来源证明。'}return '薇诺 · 侍酒师：关于「'+q+'」，我们可以从风味、产区或搭餐继续聊。当前酒款是'+w.name+'——'+w.profile}
$('chatForm').addEventListener('submit',e=>{e.preventDefault();const input=$('chatInput'),q=input.value.trim();if(!q)return;addMessage('','你：',q,true);input.value='';const reply=answer(q);setTimeout(()=>{const m=reply.indexOf('：'),name=reply.slice(0,m),body=reply.slice(m+1).trim(),r=reply.startsWith('路易')?roles.grower:reply.startsWith('米娅')?roles.chef:roles.sommelier;addMessage(r.face,name,body)},220)});
document.querySelectorAll('[data-question]').forEach(b=>b.addEventListener('click',()=>{$('chatInput').value=b.dataset.question;$('chatForm').requestSubmit()}));
document.querySelectorAll('.member').forEach(b=>b.addEventListener('click',()=>{document.querySelectorAll('.member').forEach(x=>x.classList.toggle('active',x===b));role=b.dataset.role;const r=roles[role];addMessage(r.face,r.name,role==='sommelier'?'我来帮你拆解酒款风味、口感与品鉴方法。':role==='grower'?'我来聊聊葡萄品种、产区风土和年份差异。':'我来从食材、烹饪方式和味道平衡给你搭餐建议。')}));
$('corkscrew').addEventListener('click',()=>{const tool=$('corkscrew'),b=stage.querySelector('.bottle-wrap.is-center')||$('bottleWrap'),opened=tool.getAttribute('aria-pressed')!=='true';tool.setAttribute('aria-pressed',String(opened));b.classList.toggle('opened',opened);showToast(opened?'开瓶器已旋入：酒瓶已开启演示':'已复位开瓶器');addMessage('🍷','薇诺 · 侍酒师',opened?'开瓶动作完成。实际开瓶器是交互演示，酒瓶没有真实物理模拟。':'开瓶器已复位，可以再次操作。')});
$('orderBtn').addEventListener('click',()=>{ordered++;const w=wines[current];$('orderBtn').classList.add('done');$('orderBtn').textContent='已加入订单 · ¥ '+w.price;showToast('已将「'+w.name+'」加入体验订单 · ¥ '+w.price);addMessage('🍷','薇诺 · 侍酒师','已为你记下这次体验订单：'+w.name+'，¥'+w.price+'。这是前端交互演示，尚未创建真实订单或发起支付。');setTimeout(()=>{if(current===wines.indexOf(w)){$('orderBtn').classList.remove('done');$('orderBtn').textContent='继续下单 · ¥ '+w.price}},1800)});
function showToast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),2400)}

bottleCards.forEach(card=>{card.setAttribute('role','button');card.setAttribute('aria-label','点击将这款酒切换到中央展示位');card.addEventListener('click',e=>{e.stopPropagation();const idx=Number(card.dataset.wineIndex);if(idx!==current){card.classList.add('is-selected');renderWine(idx)}});card.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();renderWine(Number(card.dataset.wineIndex))}})});
renderWine(0,false);
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea'))return;if(e.key==='ArrowLeft')renderWine(current-1);if(e.key==='ArrowRight')renderWine(current+1)});

// Drag the bottle horizontally for a tactile, product-showcase feel.
let down=false,startX=0,baseRot=0,rot=0;const bottle=$('bottleWrap');stage.addEventListener('pointerdown',e=>{const hit=e.target.closest('.bottle-wrap.is-center');if(!hit)return;down=true;startX=e.clientX;hit.setPointerCapture?.(e.pointerId);bottle.style.animationPlayState='paused'});stage.addEventListener('pointermove',e=>{if(!down)return;rot=Math.max(-32,Math.min(32,baseRot+(e.clientX-startX)*.35));bottle.querySelector('.bottle').style.transform='rotateY('+rot+'deg)'});function stopDrag(){if(!down)return;down=false;baseRot=rot;if(Math.abs(baseRot)>18){baseRot=baseRot>0?18:-18;rot=baseRot}bottle.style.animationPlayState='running';bottle.querySelector('.bottle').style.transform='rotateY('+baseRot+'deg)'}stage.addEventListener('pointerup',stopDrag);stage.addEventListener('pointercancel',stopDrag);stage.addEventListener('pointerleave',stopDrag);
</script>
</body>
</html>
